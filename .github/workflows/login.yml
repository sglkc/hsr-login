name: Daily check in

on:
  schedule:
    - cron: "30 16 * * *" # scheduled at 00:30 (UTC+8) everyday (shortly after HoYoLAB reset)
    - cron: "15 22 * * *" # scheduled at 06:15 (UTC+8) everyday (morning backup check)
  workflow_dispatch:

permissions: {}

jobs:
  check-in:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check In
        run: node index.js
        env:
          COOKIE: ${{ secrets.COOKIE || vars.COOKIE }}
          GAMES: ${{ vars.GAMES || secrets.GAMES }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK }}
          DISCORD_USER: ${{ secrets.DISCORD_USER || vars.DISCORD_USER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || vars.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          HOYOLAB_LANG: ${{ vars.HOYOLAB_LANG || secrets.HOYOLAB_LANG }}
  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1
        continue-on-error: true
